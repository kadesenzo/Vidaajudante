<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="fullBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#0072FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- L Emblem Main Gradient -->
    <linearGradient id="fullLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="28%" stop-color="#0284C7"/>
      <stop offset="65%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Circular Arc Gradient -->
    <linearGradient id="fullArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Text OS Gradient -->
    <linearGradient id="fullOsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="fullAmbientGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07070A" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="fullGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="#07070A"/>

  <!-- Radial Glow Behind Emblem -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#fullAmbientGlow)"/>

  <!-- Glowing Perimeter Ring -->
  <rect x="10" y="10" width="492" height="492" rx="98" fill="none" stroke="url(#fullBorderGrad)" stroke-width="7" stroke-opacity="0.95"/>

  <!-- CENTRAL EMBLEM GROUP -->
  <g transform="translate(0, -16)">
    <!-- Arc around Checkmark -->
    <path d="M 234 116 A 76 76 0 1 1 332 232" fill="none" stroke="url(#fullArcGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Stylized "L" Shape with Gradient -->
    <path d="M 180 72 
             C 192 72, 224 82, 228 108
             C 230 126, 230 196, 230 214
             C 230 244, 244 262, 280 262
             L 306 262
             C 322 262, 328 273, 325 285
             C 321 298, 308 304, 288 304
             L 228 304
             C 188 304, 162 274, 162 236
             L 162 94
             C 162 78, 168 72, 180 72 Z" 
          fill="url(#fullLGrad)" filter="url(#fullGlowFilter)"/>

    <!-- Bright Cyan Checkmark -->
    <path d="M 250 160 L 276 186 L 318 134" fill="none" stroke="#00F0FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#fullGlowFilter)"/>
  </g>

  <!-- TYPOGRAPHY: Life OS -->
  <g id="typography">
    <!-- Life (Bold White) & OS (Cyan-Purple Gradient) -->
    <text x="256" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="64" font-weight="800">
      <tspan fill="#FFFFFF">Life </tspan>
      <tspan fill="url(#fullOsGrad)">OS</tspan>
    </text>

    <!-- Subtitle: SUA VIDA, ORGANIZADA -->
    <text x="256" y="378" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#E2E8F0" letter-spacing="5.5">
      SUA VIDA, ORGANIZADA
    </text>
  </g>

  <!-- MODULE FEATURE ICONS ROW -->
  <g transform="translate(100, 404)">
    <!-- 1. Graduation Cap (Estudo) -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="16" fill="#0284C7" fill-opacity="0.2"/>
      <path d="M 6 15 L 16 10 L 26 15 L 16 20 Z" fill="#38BDF8"/>
      <path d="M 10 17.5 L 10 22 C 10 24 13 25.5 16 25.5 C 19 25.5 22 24 22 22 L 22 17.5" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="26" y1="15" x2="26" y2="23" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 2. Dumbbell (Treino) -->
    <g transform="translate(46, 0)">
      <circle cx="16" cy="16" r="16" fill="#16A34A" fill-opacity="0.2"/>
      <rect x="7" y="13" width="3" height="6" rx="1.5" fill="#4ADE80"/>
      <rect x="10" y="11" width="3" height="10" rx="1.5" fill="#4ADE80"/>
      <line x1="13" y1="16" x2="19" y2="16" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="19" y="11" width="3" height="10" rx="1.5" fill="#4ADE80"/>
      <rect x="22" y="13" width="3" height="6" rx="1.5" fill="#4ADE80"/>
    </g>

    <!-- 3. Apple (Alimentação/Refeições) -->
    <g transform="translate(92, 0)">
      <circle cx="16" cy="16" r="16" fill="#DC2626" fill-opacity="0.2"/>
      <path d="M 16 11 C 17 8 19 8 19 8" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 16 12 C 14 10 9 11 9 16 C 9 22 14 24 16 24 C 18 24 23 22 23 16 C 23 11 18 10 16 12 Z" fill="#FB7185"/>
    </g>

    <!-- 4. Dollar Coin (Finanças) -->
    <g transform="translate(138, 0)">
      <circle cx="16" cy="16" r="16" fill="#EAB308" fill-opacity="0.25"/>
      <circle cx="16" cy="16" r="12" fill="#FACC15"/>
      <text x="16" y="21" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#713F12">$</text>
    </g>

    <!-- 5. Calendar (Rotina & Calendário) -->
    <g transform="translate(184, 0)">
      <circle cx="16" cy="16" r="16" fill="#9333EA" fill-opacity="0.2"/>
      <rect x="8" y="10" width="16" height="14" rx="3" fill="#C084FC"/>
      <rect x="8" y="10" width="16" height="4" fill="#7E22CE"/>
      <line x1="12" y1="8" x2="12" y2="11" stroke="#E9D5FF" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="20" y1="8" x2="20" y2="11" stroke="#E9D5FF" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="1.2" fill="#FFFFFF"/>
      <circle cx="16" cy="18" r="1.2" fill="#FFFFFF"/>
      <circle cx="20" cy="18" r="1.2" fill="#FFFFFF"/>
    </g>

    <!-- 6. Clipboard (Tarefas & Projetos) -->
    <g transform="translate(230, 0)">
      <circle cx="16" cy="16" r="16" fill="#0891B2" fill-opacity="0.2"/>
      <rect x="9" y="10" width="14" height="15" rx="2" fill="#22D3EE"/>
      <rect x="13" y="8" width="6" height="3" rx="1" fill="#155E75"/>
      <line x1="12" y1="14" x2="20" y2="14" stroke="#155E75" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="18" x2="18" y2="18" stroke="#155E75" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- 7. Target / Bullseye (Metas) -->
    <g transform="translate(276, 0)">
      <circle cx="16" cy="16" r="16" fill="#EA580C" fill-opacity="0.2"/>
      <circle cx="16" cy="16" r="11" fill="none" stroke="#FB923C" stroke-width="2"/>
      <circle cx="16" cy="16" r="6" fill="none" stroke="#FB923C" stroke-width="2"/>
      <circle cx="16" cy="16" r="2.5" fill="#FB923C"/>
    </g>
  </g>
</svg>
