<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#0072FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- L Emblem Main Gradient -->
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="65%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Circular Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Checkmark Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Dark Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="#08080C"/>

  <!-- Ambient Light Center -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#ambientGlow)"/>

  <!-- Glowing Perimeter Border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.95"/>

  <!-- Internal Emblem Group -->
  <g transform="translate(0, -10)">
    <!-- Stylized Circular Arc in crook of L -->
    <path d="M 230 150 A 90 90 0 1 1 345 285" fill="none" stroke="url(#arcGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Stylized "L" Shape -->
    <!-- Starts at top left, flows down smoothly, curves wide along the base -->
    <path d="M 165 95 
             C 178 95, 218 108, 222 135
             C 225 155, 225 240, 225 260
             C 225 295, 240 315, 280 315
             L 310 315
             C 328 315, 335 328, 332 342
             C 328 358, 312 365, 290 365
             L 220 365
             C 175 365, 145 330, 145 285
             L 145 120
             C 145 102, 152 95, 165 95 Z" 
          fill="url(#lGrad)" filter="url(#glowFilter)"/>

    <!-- Electric Cyan Checkmark -->
    <path d="M 248 202 L 278 232 L 328 172" fill="none" stroke="#00F0FF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>
  </g>
</svg>
